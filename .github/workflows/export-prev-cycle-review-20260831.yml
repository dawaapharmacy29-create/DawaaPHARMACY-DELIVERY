name: Export reconciled rider cycle summary

on:
  push:
    branches: [ops/export-prev-cycle-review-20260831]
    paths:
      - '.github/workflows/export-prev-cycle-review-20260831.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Export reconciled rider summary
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          mkdir -p out
          cat > /tmp/summary.sql <<'SQL'
          COPY (
            with orders_scope as (
              select *
              from public.delivery_orders o
              where coalesce(o.work_date,o.delivery_date,(o.registered_at at time zone 'Africa/Cairo')::date,(o.created_at at time zone 'Africa/Cairo')::date)
                    between date '2026-07-26' and date '2026-08-25'
                and coalesce(o.is_deleted,false)=false
                and o.deleted_at is null
            ),
            trips_scope as (
              select *
              from public.internal_trips t
              where coalesce(t.work_date,t.trip_date,(t.registered_at at time zone 'Africa/Cairo')::date,(t.created_at at time zone 'Africa/Cairo')::date)
                    between date '2026-07-26' and date '2026-08-25'
                and t.duplicate_of is null
            ),
            rider_ids as (
              select rider_id from orders_scope where rider_id is not null
              union
              select rider_id from trips_scope where rider_id is not null
            ),
            oc as (
              select rider_id,
                     count(*)::int as total_orders,
                     count(*) filter(where approval_status='approved' and coalesce(is_countable,false)=true)::int as approved_orders,
                     count(*) filter(where approval_status='rejected')::int as rejected_orders,
                     count(*) filter(where coalesce(approval_status,'pending') not in ('approved','rejected'))::int as pending_orders
              from orders_scope group by rider_id
            ),
            tc as (
              select rider_id,
                     count(*) filter(where coalesce(is_countable,true)=true and coalesce(status,review_status,'') in ('approved','completed','countable'))::int as approved_trips,
                     count(*) filter(where coalesce(status,review_status,'')='rejected')::int as rejected_trips,
                     count(*) filter(where coalesce(status,review_status,'') like 'pending%')::int as pending_trips
              from trips_scope group by rider_id
            )
            select coalesce(r.name,'غير محدد') as "اسم الدليفري",
                   coalesce(r.branch_name,b.display_name,b.name,'') as "الفرع",
                   coalesce(oc.total_orders,0) as "إجمالي الأوردرات",
                   coalesce(oc.approved_orders,0) as "الأوردرات المقبولة المعتمدة",
                   coalesce(oc.rejected_orders,0) as "الأوردرات المرفوضة",
                   coalesce(tc.approved_trips,0) as "المشاوير المعتمدة",
                   coalesce(tc.rejected_trips,0) as "المشاوير المرفوضة",
                   coalesce(oc.pending_orders,0) as "أوردرات غير محسومة",
                   coalesce(tc.pending_trips,0) as "مشاوير غير محسومة",
                   r.id as "Rider ID"
            from rider_ids x
            left join public.riders r on r.id=x.rider_id
            left join public.branches b on b.id=r.branch_id
            left join oc on oc.rider_id=x.rider_id
            left join tc on tc.rider_id=x.rider_id
            order by coalesce(r.branch_name,b.display_name,b.name,''), coalesce(r.name,'غير محدد')
          ) TO STDOUT WITH (FORMAT CSV, HEADER TRUE, ENCODING 'UTF8');
          SQL
          psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f /tmp/summary.sql > out/rider_cycle_summary.csv

          cat > /tmp/status.sql <<'SQL'
          COPY (
            select 'orders' as source, coalesce(approval_status,'<NULL>') as status, count(*)::int as n
            from public.delivery_orders o
            where coalesce(o.work_date,o.delivery_date,(o.registered_at at time zone 'Africa/Cairo')::date,(o.created_at at time zone 'Africa/Cairo')::date)
                  between date '2026-07-26' and date '2026-08-25'
              and coalesce(o.is_deleted,false)=false and o.deleted_at is null
            group by coalesce(approval_status,'<NULL>')
            union all
            select 'trips', coalesce(status,review_status,'<NULL>'), count(*)::int
            from public.internal_trips t
            where coalesce(t.work_date,t.trip_date,(t.registered_at at time zone 'Africa/Cairo')::date,(t.created_at at time zone 'Africa/Cairo')::date)
                  between date '2026-07-26' and date '2026-08-25'
              and t.duplicate_of is null
            group by coalesce(status,review_status,'<NULL>')
            order by source,status
          ) TO STDOUT WITH (FORMAT CSV, HEADER TRUE, ENCODING 'UTF8');
          SQL
          psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f /tmp/status.sql > out/status_distribution.csv

          python3 - <<'PY'
          from pathlib import Path
          for name in ('rider_cycle_summary.csv','status_distribution.csv'):
              p=Path('out')/name
              b=p.read_bytes()
              if not b.startswith(b'\xef\xbb\xbf'):
                  p.write_bytes(b'\xef\xbb\xbf'+b)
              print(name, p.stat().st_size)
          PY

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-rider-cycle-summary-2026-07-26_to_2026-08-25
          path: out/*.csv
          retention-days: 7
          if-no-files-found: error
