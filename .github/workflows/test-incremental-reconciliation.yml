name: Test incremental reconciliation

on:
  pull_request:
    paths:
      - 'src/pages/admin/Reconciliation.tsx'
      - 'src/pages/admin/ReconciliationSafe.tsx'
      - 'src/lib/reconciliationDecision.ts'
      - 'src/lib/reconciliationBatchWrite.ts'
      - 'src/components/CustomerNameMismatchPanel.tsx'
      - 'tests/adminDecisionSafety.test.mjs'
      - 'tests/incrementalReconciliationContract.test.mjs'
      - 'scripts/patch-incremental-reconciliation.mjs'
      - 'scripts/patch-incremental-reconciliation-db-fields.mjs'
      - 'scripts/patch-reconciliation-mismatch-panel.mjs'
      - 'package.json'
      - 'supabase/migrations/20260726_incremental_reconciliation_batches.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Incremental reconciliation is now tracked source with stricter matching,
      # immutable batch snapshots and confirmation guards. The old one-shot patch
      # scripts target pre-migration text and must not rewrite current source in CI.
      - name: Verify committed reconciliation contract and approval safety
        run: pnpm exec node --test tests/incrementalReconciliationContract.test.mjs tests/adminDecisionSafety.test.mjs
      - name: Typecheck committed source
        run: pnpm exec tsc --noEmit --pretty false
      - name: Build committed source
        run: pnpm exec vite build
