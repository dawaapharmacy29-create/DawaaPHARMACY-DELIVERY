name: Test incremental reconciliation

on:
  pull_request:
    paths:
      - 'src/pages/admin/Reconciliation.tsx'
      - 'src/pages/admin/ReconciliationSafe.tsx'
      - 'src/components/CustomerNameMismatchPanel.tsx'
      - 'scripts/patch-incremental-reconciliation.mjs'
      - 'scripts/patch-incremental-reconciliation-db-fields.mjs'
      - 'scripts/patch-reconciliation-mismatch-panel.mjs'
      - 'package.json'
      - 'supabase/migrations/20260726_incremental_reconciliation_batches.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/patch-reconciliation-pagination.mjs
      - run: node scripts/patch-incremental-reconciliation.mjs
      - run: node scripts/patch-incremental-reconciliation-db-fields.mjs
      - run: node scripts/patch-reconciliation-mismatch-panel.mjs
      - run: node scripts/patch-order-receipt-storage.mjs
  build:
    needs: patches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck diagnostics
        continue-on-error: true
        shell: bash
        run: pnpm run typecheck 2>&1 | tee typecheck-output.txt
      - name: Production build
        id: production_build
        shell: bash
        run: |
          set +e
          pnpm run build > build-output.txt 2>&1
          code=$?
          cat build-output.txt
          exit $code
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-reconciliation-diagnostics-${{ github.run_id }}
          path: |
            typecheck-output.txt
            build-output.txt
          if-no-files-found: ignore
