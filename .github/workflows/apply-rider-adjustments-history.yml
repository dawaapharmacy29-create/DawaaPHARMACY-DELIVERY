name: Apply rider adjustments history fix

on:
  push:
    branches: [agent/fix-rider-adjustments-history]
    paths:
      - 'scripts/patch-rider-adjustments-history.mjs'
      - '.github/workflows/apply-rider-adjustments-history.yml'

permissions:
  contents: write

jobs:
  patch-typecheck-build:
    if: ${{ !contains(github.event.head_commit.message, 'apply rider adjustments history fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-rider-adjustments-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source patch
        run: node scripts/patch-rider-adjustments-history.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/PenaltyIncentiveManagement.tsx
          git commit -m "fix: apply rider adjustments history fix" || exit 0
          git push origin HEAD:agent/fix-rider-adjustments-history
