<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Dawaa Delivery Control</title>
    <meta name="description" content="نظام إدارة الدليفري لصيدليات دواء" />

    <!-- PWA / iPhone Home Screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Dawaa Delivery" />
    <meta name="theme-color" content="#008E92" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dawaa Delivery" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <meta property="og:image" content="/logo.png?v=2" />

    <!-- Prevent iOS phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Faster tap on mobile -->
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body { min-height: 100%; }
      body { overscroll-behavior-y: contain; }
    </style>

    <!-- Safety guard: trip proof must be camera-first, not gallery-first. -->
    <script>
      (function () {
        function textOf(el) { return (el && el.textContent || '').replace(/\s+/g, ' ').trim(); }
        function hardenTripProofUi() {
          try {
            var buttons = Array.from(document.querySelectorAll('button'));
            buttons.forEach(function (btn) {
              var text = textOf(btn);
              if (text.includes('اختيار صورة من المعرض')) {
                btn.setAttribute('data-dawaa-gallery-disabled', 'true');
                btn.style.display = 'none';
                btn.onclick = function (event) {
                  event.preventDefault();
                  event.stopPropagation();
                  alert('إثبات المشوار بالكاميرا فقط لمنع التلاعب. افتح التطبيق من Chrome واسمح بالكاميرا.');
                  return false;
                };
              }
              if (text.includes('فتح الكاميرا')) {
                btn.setAttribute('data-dawaa-camera-proof', 'true');
              }
            });
            var inputs = Array.from(document.querySelectorAll('input[type="file"][accept*="image"]'));
            inputs.forEach(function (input) {
              var refHint = (input.outerHTML || '').toLowerCase();
              if (!input.hasAttribute('capture')) {
                input.setAttribute('data-dawaa-gallery-input-disabled', 'true');
                input.setAttribute('disabled', 'disabled');
                input.style.display = 'none';
              } else {
                input.setAttribute('capture', 'environment');
                input.setAttribute('accept', 'image/*');
              }
            });
          } catch (e) {}
        }
        document.addEventListener('DOMContentLoaded', hardenTripProofUi);
        window.addEventListener('load', hardenTripProofUi);
        setInterval(hardenTripProofUi, 1500);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
